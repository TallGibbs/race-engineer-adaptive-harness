[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive_harness"
version = "0.1.0"
description = "Race Engineer Adaptive Harness: a race engineer agent inside a self-improving DMAIC harness."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastf1==3.8.3",
    "pymongo>=4.10",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "anthropic>=0.40",
    "fastembed>=0.4",
    "pytest>=8",
]

[project.scripts]
adaptive-harness = "adaptive_harness.__main__:main"

[tool.setuptools.packages.find]
include = ["adaptive_harness*", "examples*"]

[tool.setuptools.package-data]
"adaptive_harness.contracts" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
